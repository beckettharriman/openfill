# Copyright (C) 2022 Torben Giesselmann, (C) 2026 Beckett Harriman
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Lint and unit tests. GIMP itself is not installed here: the GIMP batch
# scripts in tests/gimp_batch_*.py run against a real GIMP 3 locally (see
# CONTRIBUTING.md). The unit tests use only the standard library.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        include:
          # macOS (no /proc, its own paths) runs in the public gimp-openfill repo; this private
          # repo gets no macOS runners. Put it back when this merges into gimp-openfill.
          # Windows is the main target: backslash paths, no fork, install.ps1.
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - name: Ruff lint
        run: uv tool run ruff@0.14.0 check .
      - name: Ruff format
        run: uv tool run ruff@0.14.0 format --check .
      - name: Unit tests
        run: python -m unittest discover -t . -s tests -v
      - name: PhotoCraft companion tests
        run: |
          python -m pip install --quiet pillow
          python -m unittest photocraft/tests/test_companion.py -v
