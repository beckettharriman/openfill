# OpenFill - generative fill for GIMP 3
# Copyright (C) 2026 Beckett Harriman
# SPDX-License-Identifier: Apache-2.0
#
# Lint and unit tests. GIMP itself is not installed here: the GIMP batch
# scripts in tests/gimp_batch_*.py run against a real GIMP 3 locally (see
# CONTRIBUTING.md). The unit tests use only the standard library.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        include:
          # Windows is the main target: backslash paths, no fork, install.ps1.
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - name: Ruff lint
        run: uv tool run ruff@0.14.0 check .
      - name: Ruff format
        run: uv tool run ruff@0.14.0 format --check .
      - name: Unit tests
        run: python -m unittest discover -t . -s tests -v
      - name: PhotoCraft companion tests
        run: |
          python -m pip install --quiet pillow
          python -m unittest photocraft/tests/test_companion.py -v
          python -m unittest tests.test_shared_models.Review2AppTests -v
      - name: Patchy companion tests
        run: python -m unittest patchy/tests/test_companion.py -v

  comfy-archives:
    # Every ComfyUI archive Download ComfyUI can fetch (NVIDIA, older NVIDIA cards, AMD, Intel)
    # still answers at its pinned URL with its pinned size. HEAD requests only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned ComfyUI archives resolve
        run: python tests/check_comfy_archives.py

  test-macos:
    # macOS has no /proc and its own paths. Only in the public repository: private
    # repositories on this account get no macOS runners.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -t . -s tests -v
      - name: PhotoCraft companion tests
        run: |
          python -m pip install --quiet pillow
          python -m unittest photocraft/tests/test_companion.py -v
          python -m unittest tests.test_shared_models.Review2AppTests -v
      - name: Patchy companion tests
        run: python -m unittest patchy/tests/test_companion.py -v

  photocraft-windows-fresh-install:
    # A fresh install of the PhotoCraft companion from the release zip on a clean Windows
    # runner: PhotoCraft's .msi, then the zip is made and unpacked, "Install OpenFill for
    # PhotoCraft.cmd", start, Filter menu entries, the first-run states (no ComfyUI, no
    # models, Download ComfyUI resolves its pinned archive), quit, uninstall. No GPU.
    # The oldest and the newest PhotoCraft OpenFill is tested with. PhotoCraft 0.12 to 0.16
    # install for all users (HKLM, Program Files\PhotoCraft); from 0.17 the .msi installs for
    # the user by default (HKCU, %LOCALAPPDATA%\Programs\ArtCraft\PhotoCraft) or, with
    # ALLUSERS=1, for all users (HKLM, Program Files\ArtCraft\PhotoCraft). Both are tested.
    strategy:
      fail-fast: false
      matrix:
        include:
          - photocraft: "0.12.0"
            scope: machine
            hive: HKLM
          - photocraft: "0.20.2"
            scope: user
            hive: HKCU
          - photocraft: "0.20.2"
            scope: machine
            hive: HKLM
    name: photocraft-windows-fresh-install (PhotoCraft ${{ matrix.photocraft }}, ${{ matrix.scope }})
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PC: ${{ matrix.photocraft }}
      SCOPE: ${{ matrix.scope }}
      HIVE: ${{ matrix.hive }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PhotoCraft
        shell: pwsh
        run: |
          gh release download "v$env:PC" -R storytold/photocraft -p "photocraft-$env:PC-windows-x64.msi" -D $env:RUNNER_TEMP
          $msi = Join-Path $env:RUNNER_TEMP "photocraft-$env:PC-windows-x64.msi"
          $msiArgs = @('/i', "`"$msi`"", '/qn', '/norestart')
          if ($env:SCOPE -eq 'machine' -and $env:PC -ne '0.12.0') { $msiArgs += 'ALLUSERS=1' }
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList $msiArgs
          if ($p.ExitCode -ne 0) { throw "msiexec failed: $($p.ExitCode)" }
          $key = "$($env:HIVE):\Software\PhotoCraft"
          if (-not (Test-Path $key)) { throw "PhotoCraft $env:PC wrote no $key" }
          $dir = (Get-ItemProperty $key).InstallDir
          Write-Output "$key InstallDir = $dir"
          if (-not (Test-Path (Join-Path $dir 'photocraft.exe'))) { throw "no photocraft.exe in $dir" }
      - name: Fresh install from the zip
        env:
          OPENFILL_NO_FIXED_ROOTS: "1"
        run: |
          python -m pip install --quiet pillow
          python photocraft/e2e/smoke_install.py --first-run
